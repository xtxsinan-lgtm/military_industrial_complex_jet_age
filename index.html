<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>军工复合体：喷气时代 · 试玩原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ws-design">
  <!-- Persistent Global Top Bar HUD (TopBarHUD.tscn) -->
  <header class="topbar-hud">
    <div class="brand-block">
      <span class="brand-mark">军</span>
      <span class="brand-title">军工复合体：喷气时代</span>
      <span class="brand-sep"></span>
      <span class="brand-sub">1945–1960 试玩原型</span>
    </div>
    <div class="vitals-strip">
      <div class="hud-stat"><span class="lbl">日期</span><span class="val" id="hud-date">—</span></div>
      <div class="hud-stat"><span class="lbl">现金</span><span class="val" id="hud-cash">—</span></div>
      <div class="hud-stat"><span class="lbl">空军声望</span><span class="val" id="hud-rep-usaf">—</span></div>
      <div class="hud-stat"><span class="lbl">海军声望</span><span class="val" id="hud-rep-usn">—</span></div>
      <div class="hud-stat"><span class="lbl">政治资本</span><span class="val" id="hud-pol">—</span></div>
      <div class="hud-stat"><span class="lbl">已获合同</span><span class="val" id="hud-won">—</span></div>
      <button class="btn sm hud-feed-toggle" onclick="window.MIC_UI.toggleFeed()">动态 <span class="count" id="hud-feed-count">0</span></button>
    </div>
  </header>

  <!-- 1-Click Historical Showdown Scenario Selector Bar (rendered by app.js) -->
  <section class="scenario-bar">
    <span class="eyebrow">剧本</span>
    <div class="scenario-buttons" id="scenario-buttons"></div>
  </section>

  <!-- Main Shell (Left Navigation Dock + Center Active Workspace + Right Event/Alert Feed) -->
  <main class="main-shell">
    <aside class="left-nav">
      <button class="nav-btn active" data-ws="design" onclick="window.MIC_UI.goWorkspace('design')"><span class="n">1</span><span class="lab">飞机设计</span><span class="kbd">F2</span></button>
      <button class="nav-btn" data-ws="testing" onclick="window.MIC_UI.goWorkspace('testing')"><span class="n">2</span><span class="lab">风洞与试飞</span><span class="kbd">F4</span></button>
      <button class="nav-btn" data-ws="procurement" onclick="window.MIC_UI.goWorkspace('procurement')"><span class="n">3</span><span class="lab">投标与竞飞</span><span class="kbd">F5</span></button>
      <button class="nav-btn" data-ws="propulsion" onclick="window.MIC_UI.goWorkspace('propulsion')"><span class="n">4</span><span class="lab">发动机</span><span class="kbd">F3</span></button>
      <button class="nav-btn" data-ws="tech" onclick="window.MIC_UI.goWorkspace('tech')"><span class="n">5</span><span class="lab">科技与规则</span><span class="kbd">F6</span></button>

      <details class="guide-box" open>
        <summary>上手指引</summary>
        <ol class="guide-steps">
          <li>YF-102 没有做面积律，最大马赫数卡在 1.05 左右。</li>
          <li>在<b>机身</b>画布里把 S4–S7 往下拉，收出蜂腰；或者去<b>风洞</b>做一次跨音速试验找原因。</li>
          <li>修好后马赫数能到 1.35 以上。再到<b>翼型</b>画布试试更薄的翼型。</li>
          <li>最后去<b>投标与竞飞</b>定价，和对手同场比试。</li>
        </ol>
      </details>
    </aside>

    <section id="workspace-host" class="workspace-panel"></section>

    <aside class="right-feed" id="right-event-list"></aside>
  </main>
  <div class="feed-scrim" onclick="window.MIC_UI.toggleFeed(false)"></div>
  <div id="toast-host"></div>

  <script src="data_bundle.js"></script>
  <script src="sim_kernel.js"></script>
  <script src="canvas_plots.js"></script>
  <script src="app.js"></script>
</body>
</html>
